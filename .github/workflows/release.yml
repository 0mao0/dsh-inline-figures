name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: The tag must match package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $version"
            exit 1
          fi

      - name: The changelog must carry this version
        run: node scripts/release.mjs --notes "${GITHUB_REF_NAME#v}" > /dev/null

      - name: Tests
        run: node --test

      - name: Publish the GitHub Release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs --notes "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
