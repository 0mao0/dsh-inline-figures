<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="2400" height="1440"><style>text{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.t{fill:#22221f}.t-dim{fill:#6f6f68}.t-danger{fill:#a83226}.box{fill:#f4f4f2;stroke:#d0d0ca;stroke-width:1}.box-danger{fill:#fbeeec;stroke:#d98c82;stroke-width:1.6;stroke-dasharray:6 4}.accent1{fill:#5b8def}.accent2{fill:#3fa796}.accent-danger{fill:#c96f63}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a9a92"/></marker></defs><rect x="0" y="0" width="1200" height="720" fill="#ffffff"/><text class="t-dim" x="30" y="48" font-size="12" font-weight="700" letter-spacing="1.6">WITHOUT THE PLUGIN</text><rect x="28" y="64" width="558" height="594" rx="14" fill="#fbfbfa" stroke="#e6e6e1"/><text class="t-dim" x="616" y="48" font-size="12" font-weight="700" letter-spacing="1.6">WITH dsh-inline-figures</text><rect x="614" y="64" width="558" height="594" rx="14" fill="#fbfbfa" stroke="#e6e6e1"/><text class="t" x="54" y="116" font-size="18" font-weight="700">How MCP request handling works</text><text class="t-dim" x="54" y="150" font-size="16">By default, MCP requests are serialized. The client keeps one</text><text class="t-dim" x="54" y="174" font-size="16">in-flight JSON-RPC message per connection and waits for the </text><text class="t-dim" x="54" y="198" font-size="16">response before it sends the next one, so three parts of the </text><text class="t-dim" x="54" y="222" font-size="16">stack have to agree on the same contract. The transport owns </text><text class="t-dim" x="54" y="246" font-size="16">the socket and the framing, but it does not know what a </text><text class="t-dim" x="54" y="270" font-size="16">request id means.</text><text class="t-dim" x="54" y="304" font-size="16">When a request times out, three things happen in order. The </text><text class="t-dim" x="54" y="328" font-size="16">transport raises a socket error. The session marks the id as </text><text class="t-dim" x="54" y="352" font-size="16">orphaned and drops the pending entry. The retry policy then </text><text class="t-dim" x="54" y="376" font-size="16">decides whether the message can be replayed, and it can only </text><text class="t-dim" x="54" y="400" font-size="16">replay a call that is idempotent.</text><text class="t-dim" x="54" y="434" font-size="16">Two consequences follow from this split. A timeout does not </text><text class="t-dim" x="54" y="458" font-size="16">tell you which layer failed, so the same message can mean a </text><text class="t-dim" x="54" y="482" font-size="16">dead socket, a lost response, or a policy that refused to </text><text class="t-dim" x="54" y="506" font-size="16">replay. The client exposes three separate hooks and </text><text class="t-dim" x="54" y="530" font-size="16">documents them in three separate places.</text><circle cx="59" cy="558" r="3" fill="#9a9a92"/><text class="t-dim" x="72" y="564" font-size="16">A timeout never says which layer failed.</text><circle cx="59" cy="592" r="3" fill="#9a9a92"/><text class="t-dim" x="72" y="598" font-size="16">Replay is safe only for idempotent tool calls.</text><circle cx="59" cy="626" r="3" fill="#9a9a92"/><text class="t-dim" x="72" y="632" font-size="16">Three hooks, three documents, one failure path.</text><text class="t-dim" x="640" y="114" font-size="16">By default, MCP requests are serialized: the client keeps one</text><text class="t-dim" x="640" y="138" font-size="16">in-flight JSON-RPC message per connection.</text><rect class="box" x="648" y="156" width="498" height="52" rx="10"/><rect class="accent1" x="648" y="156" width="6" height="52" rx="3"/><text class="t" x="668" y="180" font-size="15" font-weight="600">Transport</text><text class="t-dim" x="668" y="199" font-size="13">socket, framing buffer</text><path d="M897 211 L897 225" stroke="#7b828d" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect class="box" x="648" y="230" width="498" height="52" rx="10"/><rect class="accent2" x="648" y="230" width="6" height="52" rx="3"/><text class="t" x="668" y="254" font-size="15" font-weight="600">Session</text><text class="t-dim" x="668" y="273" font-size="13">request id, pending table</text><path d="M897 285 L897 299" stroke="#7b828d" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect class="box box-danger" x="648" y="304" width="498" height="52" rx="10"/><rect class="accent-danger" x="648" y="304" width="6" height="52" rx="3"/><text class="t" x="668" y="328" font-size="15" font-weight="600">Retry policy</text><text class="t-dim" x="668" y="347" font-size="13">replay only if idempotent</text><text class="t-dim" x="648" y="376" font-size="13">one in-flight message per connection</text><text class="t-dim" x="640" y="428" font-size="16">Each layer owns one thing. The transport owns the socket and </text><text class="t-dim" x="640" y="452" font-size="16">the framing. The session owns the request id and the pending </text><text class="t-dim" x="640" y="476" font-size="16">table.</text><text class="t-dim" x="640" y="510" font-size="16">A timeout does not say which layer failed. Replay is safe </text><text class="t-dim" x="640" y="534" font-size="16">only for idempotent calls.</text><text x="600" y="694" font-size="14" fill="#6f6f68" text-anchor="middle">Same facts, same answer. On the left you read it; on the right you scan it.</text></svg>