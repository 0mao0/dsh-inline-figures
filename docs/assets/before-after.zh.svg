<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 666" width="2400" height="1332"><style>text{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.t{fill:#22221f}.t-dim{fill:#6f6f68}.t-danger{fill:#a83226}.box{fill:#f4f4f2;stroke:#d0d0ca;stroke-width:1}.box-danger{fill:#fbeeec;stroke:#d98c82;stroke-width:1.6;stroke-dasharray:6 4}.accent1{fill:#5b8def}.accent2{fill:#3fa796}.accent-danger{fill:#c96f63}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a9a92"/></marker></defs><rect x="0" y="0" width="1200" height="666" fill="#ffffff"/><text class="t-dim" x="30" y="48" font-size="12" font-weight="700" letter-spacing="1.6">不装插件</text><rect x="28" y="64" width="558" height="540" rx="14" fill="#fbfbfa" stroke="#e6e6e1"/><text class="t-dim" x="616" y="48" font-size="12" font-weight="700" letter-spacing="1.6">装了 dsh-inline-figures</text><rect x="614" y="64" width="558" height="540" rx="14" fill="#fbfbfa" stroke="#e6e6e1"/><text class="t" x="54" y="116" font-size="18" font-weight="700">MCP 请求处理是怎么工作的</text><text class="t-dim" x="54" y="150" font-size="16">默认情况下，MCP 请求是串行的。客户端每条连接只保留一个在途的 </text><text class="t-dim" x="54" y="174" font-size="16">JSON-RPC 消息，收到响应后才发下一条，所以栈里有三个部分必须遵</text><text class="t-dim" x="54" y="198" font-size="16">守同一份约定。传输层持有 socket 和分帧，但它不知道请求 id 是什</text><text class="t-dim" x="54" y="222" font-size="16">么意思。</text><text class="t-dim" x="54" y="256" font-size="16">一个请求超时后，会依次发生三件事。传输层抛出 socket 错误。会话</text><text class="t-dim" x="54" y="280" font-size="16">层把该 id 标记为孤儿，并丢弃待响应条目。重试策略再判断这条消息</text><text class="t-dim" x="54" y="304" font-size="16">能否重放，而只有幂等调用才允许重放。</text><text class="t-dim" x="54" y="338" font-size="16">这个拆分带来两个后果。超时不会告诉你哪一层出了问题，所以同一条</text><text class="t-dim" x="54" y="362" font-size="16">报错可能意味着 socket 断了、响应丢了，或者策略拒绝重放。客户端</text><text class="t-dim" x="54" y="386" font-size="16">暴露三个彼此独立的钩子，并把它们写在三份不同的文档里。</text><circle cx="59" cy="414" r="3" fill="#9a9a92"/><text class="t-dim" x="72" y="420" font-size="16">超时永远不会说清是哪一层出的错。</text><circle cx="59" cy="448" r="3" fill="#9a9a92"/><text class="t-dim" x="72" y="454" font-size="16">只有幂等调用才能安全重放。</text><circle cx="59" cy="482" r="3" fill="#9a9a92"/><text class="t-dim" x="72" y="488" font-size="16">三个钩子、三份文档、一条失败路径。</text><text class="t-dim" x="640" y="114" font-size="16">默认情况下，MCP 请求是串行的：每条连接只保留一个在途的 JSON-</text><text class="t-dim" x="640" y="138" font-size="16">RPC 消息。</text><rect class="box" x="648" y="156" width="498" height="52" rx="10"/><rect class="accent1" x="648" y="156" width="6" height="52" rx="3"/><text class="t" x="668" y="180" font-size="15" font-weight="600">传输层</text><text class="t-dim" x="668" y="199" font-size="13">socket、分帧缓冲</text><path d="M897 211 L897 225" stroke="#7b828d" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect class="box" x="648" y="230" width="498" height="52" rx="10"/><rect class="accent2" x="648" y="230" width="6" height="52" rx="3"/><text class="t" x="668" y="254" font-size="15" font-weight="600">会话层</text><text class="t-dim" x="668" y="273" font-size="13">请求 id、待响应表</text><path d="M897 285 L897 299" stroke="#7b828d" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect class="box box-danger" x="648" y="304" width="498" height="52" rx="10"/><rect class="accent-danger" x="648" y="304" width="6" height="52" rx="3"/><text class="t" x="668" y="328" font-size="15" font-weight="600">重试策略</text><text class="t-dim" x="668" y="347" font-size="13">只有幂等才可重放</text><text class="t-dim" x="648" y="376" font-size="13">每条连接只允许一个在途消息</text><text class="t-dim" x="640" y="428" font-size="16">每一层只管一件事。传输层管 socket 和分帧。会话层管请求 id 和待</text><text class="t-dim" x="640" y="452" font-size="16">响应表。</text><text class="t-dim" x="640" y="486" font-size="16">超时不会说清是哪一层出的错。只有幂等调用才能安全重放。</text><text x="600" y="640" font-size="14" fill="#6f6f68" text-anchor="middle">同样的事实，同样的回答。左边要读，右边只要扫。</text></svg>