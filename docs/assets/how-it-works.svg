<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="2400" height="1320"><style>text{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.t{fill:#22221f}.t-dim{fill:#6f6f68}.t-ok{fill:#1c7c46}.box{fill:#f4f4f2;stroke:#d0d0ca;stroke-width:1}.chip{fill:#ffffff;stroke:#dcdcd6;stroke-width:1}.band{fill:#fbfbfa;stroke:#e6e6e1;stroke-width:1}.accent1{fill:#5b8def}.accent2{fill:#3fa796}.accent3{fill:#dd9a3a}.rule{stroke:#e6e6e1;stroke-width:1}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a9a92"/></marker></defs><rect class="band" x="28" y="24" width="1144" height="104" rx="14"/><text class="t" x="50" y="70" font-size="15" font-weight="700">Model</text><rect class="box" x="140" y="38" width="332" height="76" rx="10"/><rect class="accent1" x="140" y="38" width="5" height="76" rx="2.5"/><text class="t" x="154" y="65" font-size="14" font-weight="600">Decide the point wants a figure</text><text class="t-dim" x="154" y="85" font-size="12">parts, flow, comparison, counts</text><path d="M473 76 L485 76" stroke="#7b828d" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect class="box" x="490" y="38" width="332" height="76" rx="10"/><text class="t" x="504" y="65" font-size="14" font-weight="600">Call draw_figure</text><text class="t-dim" x="504" y="85" font-size="12">spec + alt + slug</text><path d="M823 76 L835 76" stroke="#7b828d" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect class="box" x="840" y="38" width="332" height="76" rx="10"/><text class="t" x="854" y="65" font-size="14" font-weight="600">Paste the returned line</text><text class="t-dim" x="854" y="85" font-size="12">![alt](.dsh-figures/…)</text><path d="M656 129 L656 145" stroke="#7b828d" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect class="band" x="28" y="148" width="1144" height="104" rx="14"/><text class="t" x="50" y="194" font-size="15" font-weight="700">Plugin</text><text class="t-dim" x="50" y="214" font-size="12">host process</text><rect class="box" x="140" y="162" width="195" height="76" rx="10"/><rect class="accent1" x="140" y="162" width="5" height="76" rx="2.5"/><text class="t" x="154" y="189" font-size="13" font-weight="600">Validate spec</text><text class="t-dim" x="154" y="209" font-size="11.5">fields, limits, enums</text><path d="M336 200 L348 200" stroke="#7b828d" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect class="box" x="349" y="162" width="195" height="76" rx="10"/><text class="t" x="363" y="189" font-size="13" font-weight="600">Lay out or sanitize</text><text class="t-dim" x="363" y="209" font-size="11.5">presets compute coordinates</text><text class="t-dim" x="363" y="226" font-size="11.5">raw_svg: sanitize + theme</text><path d="M545 200 L557 200" stroke="#7b828d" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect class="box" x="558" y="162" width="195" height="76" rx="10"/><text class="t" x="572" y="189" font-size="13" font-weight="600">Write + rasterize</text><text class="t-dim" x="572" y="209" font-size="11.5">the .svg and a .png twin</text><path d="M754 200 L766 200" stroke="#7b828d" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect class="box" x="767" y="162" width="195" height="76" rx="10"/><text class="t" x="781" y="189" font-size="13" font-weight="600">Prune</text><text class="t-dim" x="781" y="209" font-size="11.5">200 figures per session</text><path d="M963 200 L975 200" stroke="#7b828d" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect class="box" x="976" y="162" width="195" height="76" rx="10"/><rect class="accent3" x="976" y="162" width="5" height="76" rx="2.5"/><text class="t" x="990" y="189" font-size="13" font-weight="600">Return one line</text><text class="t-dim" x="990" y="209" font-size="11.5">path + markdown + warnings</text><path d="M656 253 L656 269" stroke="#7b828d" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect class="band" x="28" y="272" width="1144" height="104" rx="14"/><text class="t" x="50" y="318" font-size="15" font-weight="700">UI</text><rect class="box" x="140" y="286" width="332" height="76" rx="10"/><text class="t" x="154" y="313" font-size="14" font-weight="600">Markdown image in the reply</text><text class="t-dim" x="154" y="333" font-size="12">native ![](path)</text><path d="M473 324 L485 324" stroke="#7b828d" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect class="box" x="490" y="286" width="332" height="76" rx="10"/><text class="t" x="504" y="313" font-size="14" font-weight="600">Authenticated file route</text><text class="t-dim" x="504" y="333" font-size="12">api/file reads the session workspace</text><path d="M823 324 L835 324" stroke="#7b828d" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect class="box" x="840" y="286" width="332" height="76" rx="10"/><rect class="accent2" x="840" y="286" width="5" height="76" rx="2.5"/><text class="t" x="854" y="313" font-size="14" font-weight="600">Full width, click to zoom</text><text class="t-dim" x="854" y="333" font-size="12">never collapsed into a tool card</text><rect class="box" x="28" y="400" width="1144" height="220" rx="14"/><text class="t" x="52" y="434" font-size="15" font-weight="700">What reaches the disk: the session workspace, nothing else</text><text class="t" x="52" y="464" font-size="13">&lt;session workspace&gt;/.dsh-figures/&lt;session&gt;/</text><text class="t" x="78" y="488" font-size="13">N-slug.svg</text><text class="t-dim" x="352" y="488" font-size="12.5">vector original</text><text class="t" x="78" y="512" font-size="13">N-slug.png</text><text class="t-dim" x="352" y="512" font-size="12.5">the raster the reply embeds</text><text class="t" x="78" y="536" font-size="13">.gitignore</text><text class="t-dim" x="352" y="536" font-size="12.5">holds * , so git status stays clean</text><line class="rule" x1="52" y1="562" x2="1148" y2="562"/><text class="t-dim" x="52" y="586" font-size="12.5">No network calls, no uploads, no telemetry. At most 200 figures per session directory; older ones are pruned by mtime, and a pruned SVG takes its PNG twin with it.</text><text class="t-dim" x="52" y="609" font-size="12.5">A figure is a reference, not a copy: delete the files and old replies show a broken image.</text></svg>