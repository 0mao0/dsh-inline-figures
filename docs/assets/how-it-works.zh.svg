<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="2400" height="1320"><style>text{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.t{fill:#22221f}.t-dim{fill:#6f6f68}.t-ok{fill:#1c7c46}.box{fill:#f4f4f2;stroke:#d0d0ca;stroke-width:1}.chip{fill:#ffffff;stroke:#dcdcd6;stroke-width:1}.band{fill:#fbfbfa;stroke:#e6e6e1;stroke-width:1}.accent1{fill:#5b8def}.accent2{fill:#3fa796}.accent3{fill:#dd9a3a}.rule{stroke:#e6e6e1;stroke-width:1}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a9a92"/></marker></defs><rect class="band" x="28" y="24" width="1144" height="104" rx="14"/><text class="t" x="50" y="70" font-size="15" font-weight="700">模型</text><rect class="box" x="140" y="38" width="332" height="76" rx="10"/><rect class="accent1" x="140" y="38" width="5" height="76" rx="2.5"/><text class="t" x="154" y="65" font-size="14" font-weight="600">判定这里用图更清楚</text><text class="t-dim" x="154" y="85" font-size="12">结构、流程、对比、计数</text><path d="M473 76 L485 76" stroke="#7b828d" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect class="box" x="490" y="38" width="332" height="76" rx="10"/><text class="t" x="504" y="65" font-size="14" font-weight="600">调用 draw_figure</text><text class="t-dim" x="504" y="85" font-size="12">spec 规格 + alt + slug</text><path d="M823 76 L835 76" stroke="#7b828d" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect class="box" x="840" y="38" width="332" height="76" rx="10"/><text class="t" x="854" y="65" font-size="14" font-weight="600">把返回的那一行贴进正文</text><text class="t-dim" x="854" y="85" font-size="12">![说明](.dsh-figures/…)</text><path d="M656 129 L656 145" stroke="#7b828d" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect class="band" x="28" y="148" width="1144" height="104" rx="14"/><text class="t" x="50" y="194" font-size="15" font-weight="700">插件</text><text class="t-dim" x="50" y="214" font-size="12">宿主进程</text><rect class="box" x="140" y="162" width="195" height="76" rx="10"/><rect class="accent1" x="140" y="162" width="5" height="76" rx="2.5"/><text class="t" x="154" y="189" font-size="13" font-weight="600">校验 spec</text><text class="t-dim" x="154" y="209" font-size="11.5">字段、上限、枚举</text><path d="M336 200 L348 200" stroke="#7b828d" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect class="box" x="349" y="162" width="195" height="76" rx="10"/><text class="t" x="363" y="189" font-size="13" font-weight="600">排版或消毒</text><text class="t-dim" x="363" y="209" font-size="11.5">预设算坐标</text><text class="t-dim" x="363" y="226" font-size="11.5">raw_svg 消毒 + 注入主题</text><path d="M545 200 L557 200" stroke="#7b828d" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect class="box" x="558" y="162" width="195" height="76" rx="10"/><text class="t" x="572" y="189" font-size="13" font-weight="600">写盘 + 栅格</text><text class="t-dim" x="572" y="209" font-size="11.5">同名 .svg 与 .png 孪生</text><path d="M754 200 L766 200" stroke="#7b828d" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect class="box" x="767" y="162" width="195" height="76" rx="10"/><text class="t" x="781" y="189" font-size="13" font-weight="600">LRU 清理</text><text class="t-dim" x="781" y="209" font-size="11.5">每会话保留 200 张</text><path d="M963 200 L975 200" stroke="#7b828d" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect class="box" x="976" y="162" width="195" height="76" rx="10"/><rect class="accent3" x="976" y="162" width="5" height="76" rx="2.5"/><text class="t" x="990" y="189" font-size="13" font-weight="600">回一行 markdown</text><text class="t-dim" x="990" y="209" font-size="11.5">path + markdown + warnings</text><path d="M656 253 L656 269" stroke="#7b828d" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect class="band" x="28" y="272" width="1144" height="104" rx="14"/><text class="t" x="50" y="318" font-size="15" font-weight="700">界面</text><rect class="box" x="140" y="286" width="332" height="76" rx="10"/><text class="t" x="154" y="313" font-size="14" font-weight="600">正文里的 Markdown 图片</text><text class="t-dim" x="154" y="333" font-size="12">原生 ![](路径)</text><path d="M473 324 L485 324" stroke="#7b828d" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect class="box" x="490" y="286" width="332" height="76" rx="10"/><text class="t" x="504" y="313" font-size="14" font-weight="600">认证文件路由</text><text class="t-dim" x="504" y="333" font-size="12">api/file 读会话工作区</text><path d="M823 324 L835 324" stroke="#7b828d" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><rect class="box" x="840" y="286" width="332" height="76" rx="10"/><rect class="accent2" x="840" y="286" width="5" height="76" rx="2.5"/><text class="t" x="854" y="313" font-size="14" font-weight="600">满宽渲染、点击放大</text><text class="t-dim" x="854" y="333" font-size="12">不折叠进工具卡</text><rect class="box" x="28" y="400" width="1144" height="220" rx="14"/><text class="t" x="52" y="434" font-size="15" font-weight="700">落盘：只写会话工作区，别处不落</text><text class="t" x="52" y="464" font-size="13">&lt;会话工作区&gt;/.dsh-figures/&lt;会话&gt;/</text><text class="t" x="78" y="488" font-size="13">N-slug.svg</text><text class="t-dim" x="352" y="488" font-size="12.5">矢量原件</text><text class="t" x="78" y="512" font-size="13">N-slug.png</text><text class="t-dim" x="352" y="512" font-size="12.5">正文里嵌的位图</text><text class="t" x="78" y="536" font-size="13">.gitignore</text><text class="t-dim" x="352" y="536" font-size="12.5">内容 * ，git status 保持干净</text><line class="rule" x1="52" y1="562" x2="1148" y2="562"/><text class="t-dim" x="52" y="586" font-size="12.5">不联网、不上传、无遥测。每个会话目录最多保留 200 张，超出按 mtime 清理，PNG 随 SVG 一起删。</text><text class="t-dim" x="52" y="609" font-size="12.5">图是引用而不是副本：删掉文件，旧回答里的图就变成破图。</text></svg>