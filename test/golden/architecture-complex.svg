<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 637" width="1600" height="1499"><style>text{font-family:system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.box{fill:#f4f4f2;stroke:#dcdcd6;stroke-width:1}.chip{fill:#ffffff;stroke:#e0e0da;stroke-width:1}.tint1{fill:#eaf1fb;stroke:#b9cdea;stroke-width:1}.tint2{fill:#eaf6ef;stroke:#b4d8c3;stroke-width:1}.tint3{fill:#fbf1e6;stroke:#e7c9a3;stroke-width:1}.tint4{fill:#f2ecf8;stroke:#cbbbe4;stroke-width:1}.tint5{fill:#fdeeef;stroke:#e6b4b8;stroke-width:1}.tint6{fill:#e9f4f3;stroke:#aed4cf;stroke-width:1}.box-danger{fill:#fbeeec;stroke:#d98c82;stroke-width:1.2;stroke-dasharray:6 4}.chip-danger{fill:#fbeeec;stroke:#d98c82;stroke-width:1}.chip-ok{fill:#edf5ef;stroke:#7bb892;stroke-width:1}.badge{fill:#c96f63}.t{fill:#22221f}.t-inv{fill:#ffffff}.t-dim{fill:#6f6f68}.t-danger{fill:#a83226}.t-ok{fill:#1c7c46}.axis{stroke:#9a9a92;stroke-width:1;fill:none}.grid{stroke:#e6e6e1;stroke-width:1}.line{stroke:#9aa0aa;stroke-width:1.4;fill:none;marker-end:url(#arr)}.dot{fill:#7c5fc0;stroke:#ffffff;stroke-width:1}.ring-done{fill:#4f9d76}.ring-active{fill:#c96f63}.ring-todo{fill:#ffffff;stroke:#9a9a92;stroke-width:1.5}@media (prefers-color-scheme:dark){.box{fill:#2b2b29;stroke:#4a4a45}.chip{fill:#343431;stroke:#52524c}.tint1{fill:#22303f;stroke:#3d5670}.tint2{fill:#20332a;stroke:#3c6a51}.tint3{fill:#36291a;stroke:#6d5230}.tint4{fill:#2b2740;stroke:#4d4468}.tint5{fill:#3a2628;stroke:#6d4549}.tint6{fill:#1f302e;stroke:#3c5e59}.box-danger{fill:#3a2a28;stroke:#a05548}.chip-danger{fill:#3a2a28;stroke:#a05548}.chip-ok{fill:#25332a;stroke:#3f7a55}.badge{fill:#d05a4c}.t{fill:#e9e9e3}.t-dim{fill:#9a9a92}.t-danger{fill:#e08a7e}.t-ok{fill:#5cb884}.axis{stroke:#8a8a82}.grid{stroke:#3d3d3a}.line{stroke:#8a8a82}.dot{stroke:#343431}.ring-todo{fill:#2b2b29;stroke:#8a8a82}}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a9a92"/></marker></defs><text class="t" x="32" y="36" font-size="17" font-weight="600">Nightly 评测流水线</text><rect class="box tint1" x="32" y="62" width="616" height="105" rx="10"/><text class="t" x="46" y="83" font-size="14" font-weight="600">输入层</text><rect class="chip" x="46" y="90" width="289" height="63" rx="8"/><text class="t" x="191" y="116" font-size="14" text-anchor="middle">136 题题库</text><text class="t-dim" x="191" y="138" font-size="12" text-anchor="middle">金标+机制标注</text><rect class="chip" x="345" y="90" width="289" height="63" rx="8"/><text class="t" x="490" y="116" font-size="14" text-anchor="middle">基线结果</text><rect class="box box-danger" x="32" y="213" width="616" height="105" rx="10"/><rect class="badge" x="46" y="220" width="26" height="19" rx="5"/><text class="t-inv" x="59" y="234" font-size="12" font-weight="700" text-anchor="middle">P1</text><text class="t" x="82" y="234" font-size="14" font-weight="600">生成层</text><rect class="chip" x="46" y="241" width="189" height="43" rx="8"/><text class="t" x="141" y="267" font-size="14" text-anchor="middle">模型A</text><rect class="chip" x="245" y="241" width="189" height="43" rx="8"/><text class="t" x="340" y="267" font-size="14" text-anchor="middle">模型B</text><rect class="chip" x="444" y="241" width="189" height="43" rx="8"/><text class="t" x="539" y="267" font-size="14" text-anchor="middle">对照臂</text><text class="t-danger" x="46" y="308" font-size="12">生成端噪声是主要翻转源</text><rect class="box tint3" x="32" y="364" width="616" height="85" rx="10"/><rect class="badge" x="46" y="371" width="26" height="19" rx="5"/><text class="t-inv" x="59" y="385" font-size="12" font-weight="700" text-anchor="middle">P0</text><text class="t" x="82" y="385" font-size="14" font-weight="600">判分层</text><rect class="chip" x="46" y="392" width="289" height="43" rx="8"/><text class="t" x="191" y="418" font-size="14" text-anchor="middle">LLM 裁判</text><rect class="chip" x="345" y="392" width="289" height="43" rx="8"/><text class="t" x="490" y="418" font-size="14" text-anchor="middle">规则裁判</text><rect class="box tint4" x="32" y="495" width="616" height="85" rx="10"/><text class="t" x="46" y="516" font-size="14" font-weight="600">汇总层</text><rect class="chip" x="46" y="523" width="289" height="43" rx="8"/><text class="t" x="191" y="549" font-size="14" text-anchor="middle">p90 耗时</text><rect class="chip" x="345" y="523" width="289" height="43" rx="8"/><text class="t" x="490" y="549" font-size="14" text-anchor="middle">错题机制</text><path class="line" d="M296 169 L296 203"/><path class="line" d="M340 320 L340 354"/><path class="line" d="M384 451 L384 485"/><text class="t-danger" x="32" y="598" font-size="14">橙色压线带 (0.3~0.65) 是复核性价比最高的池子</text></svg>